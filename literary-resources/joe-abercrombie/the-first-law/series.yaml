notes: >-
  The shared First Law world. The library has the Portuguese editions of the
  original trilogy (Calibre 39, 41, 40) and the English editions of The Age of
  Madness. The PT-BR trilogy is the terminology canon for shared world terms;
  the Age of Madness novels are the current translation source. No official
  PT-BR edition of the Age of Madness was verified.
