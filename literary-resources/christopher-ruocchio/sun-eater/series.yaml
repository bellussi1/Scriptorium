notes: >-
  Seven main novels plus three novellas. The library has the official Brazilian
  edition of book 1 (Império do Silêncio, Calibre 436) and English originals for
  books 2-7 and the novellas. Calibre metadata for the main novels is broken:
  they have no series link and all carry series_index 1.0. This file is the
  source of truth for the translation queue; do not edit metadata.db without
  explicit authorization. The novellas are optional and should not block the
  main sequence.
