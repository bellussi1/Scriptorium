# Style profile for the Sun Eater series.
# Hand-authored from the local editorial samples; safe to edit by hand.
description: Retrospective first-person grandeur, cosmic scale, and ironic self-mythology.
mode: source
context: A far-future interstellar empire with faster-than-light travel, cryonic fugue, hereditary titles, and a state religion. Technology is advanced but socially archaic, and imperial power is exercised through court ritual, military rank, and religious law.
rules:
  - dimension: narrative_voice
    instruction: Keep the first-person retrospective frame of a narrator writing history after the fact; let him address the reader, dramatize his own memory, and mythologize himself while also undercutting the myth.
  - dimension: register
    instruction: Sustain an elevated literary register with classical, religious, and military diction; let irony and self-awareness prevent the grandeur from becoming solemn, and avoid modern colloquialisms in narration.
  - dimension: verb_tense
    instruction: Preserve the retrospective past frame. Keep the English simple past and past perfect as Portuguese pretérito perfeito and pretérito mais-que-perfeito; use the present only for direct address, aphorism, or a scene explicitly in the present, and do not let the narration drift into an unmarked present. Keep sequence-of-tense relations when a past event is seen from a later past.
  - dimension: grammatical_gender
    instruction: Respect the gender recorded in the glossary and the natural gender of every character. Make articles, adjectives, participles and pronouns agree, never default a female character or a gendered term to masculine, and keep the chosen gender consistent across the book. When a noun's gender is not in the glossary, choose the Portuguese noun's natural gender and stay with it.
  - dimension: prose_and_idiom
    instruction: Write Portuguese prose rather than English calques. Prefer Portuguese word order, verb collocations and connective logic; read each paragraph as a unit, keep the narrator's ironic self-mythology, and do not smooth fragments, rhetorical periods or deliberate repetition into neutral, generic prose.
  - dimension: sentence_rhythm
    instruction: Vary by scene, using long accumulative periods for court ritual and exposition and short fragments or one-line paragraphs for disorientation and combat, and for moments of revelation; do not even out the extremes.
  - dimension: dialogue
    instruction: Keep dialogue clipped and title-conscious; let rank and nation shape diction, and let ideology shape what a speaker will not say, while preserving interruptions and non-answers, and keeping verbal duels intact instead of smoothing them into cooperative exchange.
  - dimension: imagery
    instruction: Draw images from light and darkness and from fire and glass; draw them too from flesh and machinery and from imperial architecture, and keep them cosmic in scale but physically precise rather than generically picturesque.
  - dimension: lexicon
    instruction: Use techno-archaic and Latinate vocabulary with confidence, keep invented terms consistent, and do not gloss them inside the narrative; avoid modern technical jargon that breaks the archaic frame.
  - dimension: punctuation
    instruction: Use em dashes for interruption and aside, semicolons for rhetorical accumulation, and fragments for shock; do not inflate exclamation marks or scatter ellipses for atmosphere.
  - dimension: formatting
    instruction: Allow a single sentence or a single word to stand as a paragraph at a turn or shock, use longer paragraphs for argument and worldbuilding, and preserve chapter titles, epigraph-like openings, direct address to the reader, and white space around isolated lines as part of the narrative architecture.
  - dimension: target_variety
    instruction: Write Brazilian Portuguese (pt-BR), not European Portuguese. Use "você" for the second person and never "tu". Use Brazilian progressive forms ("estou fazendo", "está ficando") and Brazilian clitic placement ("me disse", "não te vejo"). Avoid European forms such as "estou a fazer", "contacto", "ecrã", "equipa", "autocarro", "rapariga", "demónio" and "prémio"; use "de fato" and Brazilian spelling throughout.
