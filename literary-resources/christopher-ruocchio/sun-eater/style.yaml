  observations:
    - "Both English samples sustain a retrospective first person that addresses the reader and comments on the act of remembering; book 3 widens the frame into court ritual and imperial history."
    - "The prose moves between clipped scene work and long expository periods; the short paragraph is a structural device, not an occasional flourish."
    - "The Portuguese comparison is cross-book: there is no aligned English sample of book 1, so sentence-level equivalence cannot be measured."
    - "The Portuguese sample preserves the high register, fragments, and direct address, but expands some periods and uses a European-leaning pronominal syntax."
