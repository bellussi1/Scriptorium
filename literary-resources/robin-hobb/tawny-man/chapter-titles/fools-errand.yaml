# Chapter titles for "Fool's Errand" (The Tawny Man 1), English -> pt-BR.
#
# Used by src/literary/chapter_titles.py to localise the table of contents and
# the chapter headings. The reader-facing label is built as
# "Capítulo <ROMAN> <TÍTULO>", with the title in capitals.
#
# `en` is the English chapter title as printed in the source EPUB. `pt` is the
# title already used in the translated body; the body and this map must agree
# once the pt value is uppercased.
#
# The English source has no "Chapter N" heading for V, X, XIV, XXI and XXVIII.
# Their titles are the capitalised line that opens each of those chapters, and
# the numbers follow the sequence of the surrounding chapters.
#
# Editorial choices: review before publishing. Proper names are kept as in the
# source. "Dutiful" is still in English in the translated body; it is kept
# here until an editorial decision is made.
