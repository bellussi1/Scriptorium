# Style profile for the Liveship Traders trilogy (provisional).
# Hand-authored structural prior; no local sample of this subseries was supplied.
description: Third-person multiple viewpoint, maritime trade, and family intrigue (provisional).
mode: source
context: A pre-industrial maritime trading society of merchant families, where ocean-going ships are living vessels and trade law, family alliance, and navigation govern daily life. Ports are multilingual, credit is personal, and weather and tide decide what is possible.
rules:
  - dimension: narrative_voice
    instruction: Use third-person limited narration with multiple viewpoints; anchor each section in one consciousness, and let the reader learn the world through the trade, family, and local knowledge of that character rather than through omniscient summary.
  - dimension: register
    instruction: Keep the register concrete and commercial even when the subject is fantastic; let manners, credit, and family obligation carry the social texture, and avoid both epic inflation and modern slang.
  - dimension: sentence_rhythm
    instruction: Give sailing, loading, and confrontation scenes a clear spatial geometry and a steady accumulation of physical detail; shorten sentences when a negotiation or a danger closes in.
  - dimension: formatting
    instruction: Move between viewpoints at scene or chapter boundaries, not inside a paragraph; end sections on a decision, a reversal, or a material image rather than on summary.
  - dimension: dialogue
    instruction: Differentiate speakers by class, nation, and family habit; let bargaining, evasion, and polite hostility do the work, and do not make every voice equally witty or equally plain.
  - dimension: imagery
    instruction: Draw images from ships and rigging and from water and weather; draw them too from wood and rope and from the body under strain, and keep the fantastic elements embedded in ordinary labor rather than staged as spectacle.
  - dimension: lexicon
    instruction: Use precise nautical, mercantile, and legal vocabulary, and keep ship parts and trade terms consistent; avoid explanatory glosses and modern business jargon.
evidence:
  samples: []
  basis:
    - "No local sample of this subseries. The profile is a structural prior derived from the known narrative situation and from the universe-level profile."
    - "The main differences from the sampled first-person series are the third-person multiple viewpoint, the larger cast, and the weight of maritime and commercial detail."
notes: "confidence: provisional. No sample of this subseries was supplied. Validate against at least three chapters before treating any rule as a close-reading finding; the profile avoids quantitative claims about sentence length or dialogue ratio that cannot be observed locally."
