# Chapter titles for "Ship of Magic" (The Liveship Traders 1), English -> pt-BR.
#
# Used by src/literary/chapter_headings.py to restore chapter headings in the
# body and to build the table of contents (NCX). The `en` value must equal the
# English heading title in the source EPUB (typographic apostrophes are compared
# as ASCII). The reader-facing TOC label is built as "Capítulo N TÍTULO" and the
# body heading as "CAPÍTULO N" followed by the title in capitals.
#
# `parts` lists the English part headings (MIDSUMMER, AUTUMN, WINTER); each opens
# the chapter given in `before`. `body_start` marks where the book text starts.
#
# `residue` lists the pieces of translator heading text that sit in the body
# just before a chapter (exact text, in order). They are removed and replaced by
# the canonical headings. Leave it empty when the body has no such text.
#
# Titles are editorial choices made without an official edition: review them
# before publishing. Terms follow literary-resources/robin-hobb/realm-of-the-elderlings/
# liveship-traders/glossary.yaml where it has an entry.
