version: 1
scope: subseries
source_language: en
target_language: pt-BR
notes: >-
  Liveship Traders terminology. Ship of Magic was approved in 2026; terms that
  occur there use its Portuguese surface forms as the canon. Terms introduced
  later remain provisional until the trilogy review.
terms:
  - source: Liveship
    target: navio vivo
    category: item
    policy: translate
    aliases: [Liveships]
    alias_targets: {Liveships: navios vivos}
    notes: >-
      The approved translation uses navio vivo; navio-vivo also occurs. Prefer
      the spaced form in running text and keep the hyphen only where the
      approved edition uses it.
    source_reference: "Approved PT-BR translation, Ship of Magic (2026)"
    confidence: reviewed
    first_appearance: ship-of-magic
    approved: true
