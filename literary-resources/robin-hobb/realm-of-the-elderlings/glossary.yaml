  deliberately absent rather than guessed.
terms:
  - source: Six Duchies
    target: Seis Ducados
    category: location
    policy: translate
    aliases: [Six Duchies]
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Farseer
    target: Farseer
    category: organization
    policy: keep
    aliases: []
    notes: "The ruling dynasty; the official PT edition keeps the name."
    source_reference: "Official PT-BR edition, Calibre 94"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Red-Ship
    target: Navio Vermelho
    category: item
    policy: translate
    aliases: [Red Ship, Red Ships]
    alias_targets: {Red Ships: "Navios Vermelhos"}
    notes: >-
      The official PT edition uses Navio Vermelho; plural contexts use Navios
      Vermelhos. Let Portuguese inflection handle the plural.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Forged
    target: Forjados
    category: concept
    policy: translate
    aliases: [Forged ones, The Forged]
    alias_targets: {The Forged: "Os Forjados"}
    notes: "The official PT edition uses Forjados."
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Out Islands
    target: Ilhas Externas
    category: location
    policy: translate
    aliases: [Out Islanders, Out Islander]
    alias_targets: {Out Islanders: ilhéus, Out Islander: ilhéu}
    notes: >-
      The official PT edition calls the people ilhéus, not a periphrase with
      Ilhas Externas. Keep the place name Ilhas Externas and the demonym ilhéu.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Chyurda
    target: chyurda
    category: organization
    policy: transliterate
    aliases: [Chyurdas]
    notes: >-
      Ethnic group; the official PT edition uses lowercase chyurda / chyurdas.
      Do not capitalize in mid-sentence unless the source does.
    source_reference: "Official PT-BR editions, Calibre 94/92"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Assassin
    target: Assassino
    category: title
    policy: translate
    aliases: [Assassins]
    alias_targets: {Assassins: Assassinos}
    notes: >-
      The trade and the book title use Assassino (O Aprendiz de Assassino).
      Do not use "executor" or "matador" for the formal trade.
    source_reference: "Official PT-BR edition, Calibre 94"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Buckkeep
    target: Torre do Cervo
    category: location
    policy: translate
    aliases: [Buckkeep Castle, Buckkeep Town]
    alias_targets:
      Buckkeep Castle: Castelo de Torre do Cervo
      Buckkeep Town: cidade de Torre do Cervo
    notes: >-
      The official PT edition uses Torre do Cervo. The castle and the town use
      the same name; add Castelo/cidade only when the source makes the
      distinction explicit.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Buck
    target: Buck
    category: location
    policy: keep
    notes: "Duchy name; the official PT edition keeps Buck (Ducados de Buck e Farrow)."
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
