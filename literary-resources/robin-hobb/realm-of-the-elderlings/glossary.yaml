    first_appearance: assassins-apprentice
    approved: true
  - source: Farrow
    target: Farrow
    category: location
    policy: keep
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Skill
    target: Talento
    category: concept
    policy: translate
    aliases: [Skilling, Skilled]
    alias_targets: {Skilling: Talento, Skilled: Talentoso}
    notes: >-
      The official PT edition calls the magic Talento and a trained user
      Talentoso. Do not use Habilidade for the named magic; reserve it for the
      ordinary sense of skill.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Wit
    target: Manha
    category: concept
    policy: translate
    aliases: [Witted, Wit-bond]
    alias_targets: {Witted: dotado da Manha, Wit-bond: vínculo da Manha}
    notes: >-
      The official PT edition calls the magic Manha. Witted is best rendered
      contextually as "dotado da Manha" or "quem tem a Manha"; do not turn the
      magic into a common noun like astúcia.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Elderlings
    target: Antigos
    category: other
    policy: translate
    aliases: [Elderling]
    alias_targets: {Elderling: Antigo}
    notes: >-
      The official PT edition uses os Antigos. This is the ancient race, not a
      generic adjective; keep the capital A when the source capitalizes it.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
  - source: Others
    target: Outros
    category: other
    policy: translate
    notes: >-
      Mythical beings in the Farseer frame; the official PT edition uses os
      Outros. Do not confuse with the ordinary pronoun outros.
    source_reference: "Official PT-BR editions, Calibre 94/92/71"
    confidence: confirmed
    first_appearance: assassins-apprentice
    approved: true
