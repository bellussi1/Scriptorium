name: Realm of the Elderlings
slug: realm-of-the-elderlings
author: Robin Hobb
universe: Realm of the Elderlings
notes: >-
  Sixteen novels in five subseries, plus one optional novella. Publication order
  is the recommended first-read and first-translation order. The library has
  English originals for all five subseries and official Brazilian editions for
  the three Farseer volumes. The Rain Wild Chronicles is present as a single
  omnibus (Calibre 331) containing four novels; split it before producing a
  per-novel queue.
