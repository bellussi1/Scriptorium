    <p><span class="CO">TIVAMOS NOSSO CARON </span>com olhos como brasas, nosso barqueiro de almas. Ele era o velho florentino que deve ter sentido o mesmo na amurada do navio de Caronte enquanto cruzava o Aqueronte, e eu me perguntei se os mortos algum dia se cansam da travessia.</p>
