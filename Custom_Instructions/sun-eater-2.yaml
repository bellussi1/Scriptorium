description: Retrospective first-person grandeur, cosmic scale, and ironic self-mythology.
mode: source
context: A far-future interstellar empire with faster-than-light travel, cryonic fugue,
  hereditary titles, and a state religion. Technology is advanced but socially archaic,
  and imperial power is exercised through court ritual, military rank, and religious
  law.
rules:
- dimension: narrative_voice
  instruction: Keep the first-person retrospective frame of a narrator writing history
    after the fact; let him address the reader, dramatize his own memory, and mythologize
    himself while also undercutting the myth.
- dimension: register
  instruction: Sustain an elevated literary register with classical, religious, and
    military diction; let irony and self-awareness prevent the grandeur from becoming
    solemn, and avoid modern colloquialisms in narration.
- dimension: sentence_rhythm
  instruction: Vary by scene, using long accumulative periods for court ritual and
    exposition and short fragments or one-line paragraphs for disorientation and combat,
    and for moments of revelation; do not even out the extremes.
- dimension: dialogue
  instruction: Keep dialogue clipped and title-conscious; let rank and nation shape
    diction, and let ideology shape what a speaker will not say, while preserving
    interruptions and non-answers, and keeping verbal duels intact instead of smoothing
    them into cooperative exchange.
- dimension: imagery
  instruction: Draw images from light and darkness and from fire and glass; draw them
    too from flesh and machinery and from imperial architecture, and keep them cosmic
    in scale but physically precise rather than generically picturesque.
- dimension: lexicon
  instruction: Use techno-archaic and Latinate vocabulary with confidence, keep invented
    terms consistent, and do not gloss them inside the narrative; avoid modern technical
    jargon that breaks the archaic frame.
- dimension: punctuation
  instruction: Use em dashes for interruption and aside, semicolons for rhetorical
    accumulation, and fragments for shock; do not inflate exclamation marks or scatter
    ellipses for atmosphere.
- dimension: formatting
  instruction: Allow a single sentence or a single word to stand as a paragraph at
    a turn or shock, use longer paragraphs for argument and worldbuilding, and preserve
    chapter titles, epigraph-like openings, direct address to the reader, and white
    space around isolated lines as part of the narrative architecture.
translation: 'Match the following writing style in the translation. These rules describe
  how the text must read; they never authorize adding, removing, or altering content.


  ## Setting


  A far-future interstellar empire with faster-than-light travel, cryonic fugue, hereditary
  titles, and a state religion. Technology is advanced but socially archaic, and imperial
  power is exercised through court ritual, military rank, and religious law.


  ## Style


  - Keep the first-person retrospective frame of a narrator writing history after
  the fact; let him address the reader, dramatize his own memory, and mythologize
  himself while also undercutting the myth.

  - Sustain an elevated literary register with classical, religious, and military
  diction; let irony and self-awareness prevent the grandeur from becoming solemn,
  and avoid modern colloquialisms in narration.

  - Vary by scene, using long accumulative periods for court ritual and exposition
  and short fragments or one-line paragraphs for disorientation and combat, and for
  moments of revelation; do not even out the extremes.

  - Keep dialogue clipped and title-conscious; let rank and nation shape diction,
  and let ideology shape what a speaker will not say, while preserving interruptions
  and non-answers, and keeping verbal duels intact instead of smoothing them into
  cooperative exchange.

  - Draw images from light and darkness and from fire and glass; draw them too from
  flesh and machinery and from imperial architecture, and keep them cosmic in scale
  but physically precise rather than generically picturesque.

  - Use techno-archaic and Latinate vocabulary with confidence, keep invented terms
  consistent, and do not gloss them inside the narrative; avoid modern technical jargon
  that breaks the archaic frame.

  - Use em dashes for interruption and aside, semicolons for rhetorical accumulation,
  and fragments for shock; do not inflate exclamation marks or scatter ellipses for
  atmosphere.

  - Allow a single sentence or a single word to stand as a paragraph at a turn or
  shock, use longer paragraphs for argument and worldbuilding, and preserve chapter
  titles, epigraph-like openings, direct address to the reader, and white space around
  isolated lines as part of the narrative architecture.

  '
