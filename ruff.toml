# Ruff configuration (lint only).
# Run: venv\Scripts\python.exe -m ruff check .
# Baseline findings: docs/project/reviews/python-lint-baseline-2026-11-11.md
#
# Conservative on purpose: no formatter, no autofix in CI, no line-length rule.
# Ruff's default set is E4, E7, E9, F; we add isort (I). F covers the pyflakes checks.

target-version = "py312"

extend-exclude = [
  "venv",
  "data",
  "translated_files",
  "node_modules",
  ".claude",
  ".git",
  "benchmark/data",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
